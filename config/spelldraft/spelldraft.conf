# Adventurer SpellDraft runtime configuration
#
# This file is intentionally data-only. Balance/catalog changes here must not
# require recompiling worldserver.
#
# Integer values are >= 0 unless noted otherwise. A GainEveryLevels value of 0
# disables automatic gains for that resource.

[Draft]
OfferSize = 3
InitialActivePicks = 3
InitialActiveSourceLevelCap = 10
# Up to the initial cap, active cards use the fixed cap above. Once the player
# is above it, active cards may come from this many source levels ahead.
ActiveSourceLevelLookahead = 3
ActiveDraftFirstLevel = 5
ActiveDraftEveryLevels = 5
TalentDraftFirstLevel = 5
TalentDraftEveryLevels = 1

[Rarity]
CommonWeightMultiplier = 100
UncommonWeightMultiplier = 55
RareWeightMultiplier = 25
EpicWeightMultiplier = 10
LegendaryWeightMultiplier = 3

[Reroll]
# Initial SpellDraft currency. Further charges come from Gauntlet loot, not levels.
StartingCharges = 3
GainEveryLevels = 0
GainAmount = 0
MaxCharges = 0

[Bless]
# Initial SpellDraft currency. Further charges come from Gauntlet loot, not levels.
StartingCharges = 1
GainEveryLevels = 0
GainAmount = 0
MaxCharges = 0
MaxActive = 1
WeightMultiplierPercent = 300

[Destroy]
# Initial SpellDraft currency. Further charges come from Gauntlet loot, not levels.
StartingCharges = 1
GainEveryLevels = 0
GainAmount = 0
MaxCharges = 0
