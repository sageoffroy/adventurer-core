# Adventurer SpellDraft runtime configuration
#
# This file is intentionally data-only. Balance/catalog changes here must not
# require recompiling worldserver.
#
# Integer values are >= 0 unless noted otherwise. A GainEveryLevels value of 0
# disables automatic gains for that resource.

[Draft]
OfferSize = 3
InitialActivePicks = 3
InitialActiveSourceLevelCap = 10
ActiveDraftFirstLevel = 5
ActiveDraftEveryLevels = 5
TalentDraftFirstLevel = 10
TalentDraftEveryLevels = 1

[Rarity]
CommonWeightMultiplier = 100
UncommonWeightMultiplier = 55
RareWeightMultiplier = 25
EpicWeightMultiplier = 10
LegendaryWeightMultiplier = 3

[Reroll]
# Prototype defaults only; these are balance knobs, not closed design values.
StartingCharges = 10
GainEveryLevels = 5
GainAmount = 1
MaxCharges = 0

[Bless]
# Blessing never grants the card. It consumes one charge and multiplies the
# effective draw weight of the chosen eligible card while it remains blessed.
# MaxActive = 1 means one blessed card at a time.
StartingCharges = 1
GainEveryLevels = 10
GainAmount = 1
MaxCharges = 0
MaxActive = 1
WeightMultiplierPercent = 300

[Destroy]
# Destroy permanently removes the selected card from this character's pool.
# Charges are configurable independently from rerolls and blessings.
StartingCharges = 1
GainEveryLevels = 10
GainAmount = 1
MaxCharges = 0
