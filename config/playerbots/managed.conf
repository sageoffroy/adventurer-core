# Adventurer Core managed Playerbots profile.
#
# Only the keys listed here are owned by this project. The installer patches
# those assignments in the deployed playerbots.conf and preserves every other
# Playerbots option unchanged.
#
# DeleteRandomBotAccounts must remain 0 here. Account deletion is a one-shot
# maintenance operation and must never happen implicitly during update/apply.

AiPlayerbot.Enabled = 1
AiPlayerbot.RandomBotAutologin = 1
AiPlayerbot.MinRandomBots = 20
AiPlayerbot.MaxRandomBots = 30
AiPlayerbot.RandomBotAccountCount = 0
AiPlayerbot.AddClassAccountPoolSize = 5
AiPlayerbot.MaxAddedBots = 10
AiPlayerbot.DisabledWithoutRealPlayer = 1
AiPlayerbot.DisabledWithoutRealPlayerLoginDelay = 5
AiPlayerbot.DisabledWithoutRealPlayerLogoutDelay = 60
AiPlayerbot.EnablePeriodicOnlineOffline = 0
AiPlayerbot.SyncLevelWithPlayers = 1
AiPlayerbot.IterationsPerTick = 5
AiPlayerbot.DynamicReactDelay = 1
AiPlayerbot.BotAutologin = 0
AiPlayerbot.DeleteRandomBotAccounts = 0
