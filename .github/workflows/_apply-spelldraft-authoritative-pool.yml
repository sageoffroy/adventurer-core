name: apply spelldraft authoritative pool migration

on:
  push:
    branches:
      - feature/spelldraft-meta-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spelldraft-meta-v2
          fetch-depth: 0

      - name: Apply migration
        run: python3 tools/_apply_spelldraft_pool_fix.py

      - name: Run focused tests
        run: |
          python3 -m unittest tests.test_spelldraft_authoritative_pool
          python3 -m unittest tests.test_spelldraft_design_catalog
          python3 -m unittest tests.test_spelldraft_runtime

      - name: Remove temporary migration helpers
        run: |
          rm -f tools/_apply_spelldraft_pool_fix.py
          rm -f .github/workflows/_apply-spelldraft-authoritative-pool.yml

      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(spelldraft): make pool debug server-authoritative"
          git push origin HEAD:feature/spelldraft-meta-v2
