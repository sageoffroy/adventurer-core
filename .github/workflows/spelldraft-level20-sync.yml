name: one-shot spelldraft level20 sync

on:
  push:
    branches:
      - feature/spelldraft-meta-v2

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spelldraft-meta-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact SpellDraft level20 update
        shell: bash
        run: python -c "import base64; exec(compile(base64.b64decode('    '), '<spelldraft-level20-sync>', 'exec'))"
      - name: Run repository verification
        shell: bash
        run: |
          python -m py_compile tools/*.py
          python -m unittest discover -s tests -v
          bash -n apply.sh preflight.sh verify.sh rollback.sh update.sh
      - name: Commit verified update
        shell: bash
        run: |
          git rm .github/workflows/spelldraft-level20-sync.yml
          git add \
            config/spelldraft/cards.csv \
            config/spelldraft/spelldraft.conf \
            payload/core/src/server/scripts/Custom/adventurer_core.cpp \
            client/AdventurerDraftMeta.lua \
            tests/test_spelldraft_v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(spelldraft): expand active catalog through level 20"
          git push origin HEAD:feature/spelldraft-meta-v2
