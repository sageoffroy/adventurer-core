name: one-shot SpellDraft runtime fix

on:
  push:
    branches:
      - feature/spelldraft-meta-v2
    paths:
      - .github/workflows/one-shot-spelldraft-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spelldraft-meta-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply exact SpellDraft runtime patch
        run: python tools/one_shot_spelldraft_runtime_fix.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add payload/core/src/server/scripts/Custom/adventurer_core.cpp client/AdventurerDraftMeta.lua config/spelldraft/spelldraft.conf tests/test_spelldraft_v1.py tests/test_bless_charges.py
          git commit -m "fix(spelldraft): honor runtime config and finite bless charges"
          git push origin HEAD:feature/spelldraft-meta-v2
