name: one-shot SpellDraft runtime fix

on:
  push:
    branches: [feature/spelldraft-meta-v2]
    paths:
      - .github/workflows/one-shot-spelldraft-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spelldraft-meta-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact SpellDraft runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          core = 'payload/core/src/server/scripts/Custom/adventurer_core.cpp'
          client = 'client/AdventurerDraftMeta.lua'
          config = 'config/spelldraft/spelldraft.conf'
          tests = 'tests/test_spelldraft_v1.py'

          replace(core,
              'constexpr uint32 ADVENTURER_DRAFT_SCHEMA = 2;',
              'constexpr uint32 ADVENTURER_DRAFT_SCHEMA = 3;')
          replace(core,
              '    uint8 initialActiveSourceLevelCap = 8;',
              '    uint8 initialActiveSourceLevelCap = 10;')
          replace(core,
              '    uint16 rerollStartingCharges = 2;',
              '    uint16 rerollStartingCharges = 10;')
          replace(core,
              '''    uint8 blessMaxActive = 1;
    uint32 blessWeightMultiplierPercent = 300;''',
              '''    uint16 blessStartingCharges = 1;
    uint8 blessGainEveryLevels = 10;
    uint16 blessGainAmount = 1;
    uint16 blessMaxCharges = 0;
    uint8 blessMaxActive = 1;
    uint32 blessWeightMultiplierPercent = 300;''')
          replace(core,
              '''    uint16 rerollCharges = 0;
    uint16 destroyCharges = 0;''',
              '''    uint16 rerollCharges = 0;
    uint16 blessCharges = 0;
    uint16 destroyCharges = 0;''')
          replace(core,
              '''    parsed.blessMaxActive = static_cast<uint8>(ReadOption(values, "Bless.MaxActive", parsed.blessMaxActive));
    parsed.blessWeightMultiplierPercent = ReadOption(values, "Bless.WeightMultiplierPercent", parsed.blessWeightMultiplierPercent);''',
              '''    parsed.blessStartingCharges = static_cast<uint16>(ReadOption(values, "Bless.StartingCharges", parsed.blessStartingCharges));
    parsed.blessGainEveryLevels = static_cast<uint8>(ReadOption(values, "Bless.GainEveryLevels", parsed.blessGainEveryLevels));
    parsed.blessGainAmount = static_cast<uint16>(ReadOption(values, "Bless.GainAmount", parsed.blessGainAmount));
    parsed.blessMaxCharges = static_cast<uint16>(ReadOption(values, "Bless.MaxCharges", parsed.blessMaxCharges));
    parsed.blessMaxActive = static_cast<uint8>(ReadOption(values, "Bless.MaxActive", parsed.blessMaxActive));
    parsed.blessWeightMultiplierPercent = ReadOption(values, "Bless.WeightMultiplierPercent", parsed.blessWeightMultiplierPercent);''')
          replace(core,
              '''// v2: schema,level,pendingA,pendingT,type,o1,o2,o3,rerolls,destroys,blessed,
//     oCARD:RANK...,xCARD...''',
              '''// v2: schema,level,pendingA,pendingT,type,o1,o2,o3,rerolls,destroys,blessed,
//     oCARD:RANK...,xCARD...
// v3: schema,level,pendingA,pendingT,type,o1,o2,o3,rerolls,blesses,destroys,
//     blessed,oCARD:RANK...,xCARD...''')
          replace(core,
              '''        << ',' << state.rerollCharges
        << ',' << state.destroyCharges
        << ',' << state.blessedCardId;''',
              '''        << ',' << state.rerollCharges
        << ',' << state.blessCharges
        << ',' << state.destroyCharges
        << ',' << state.blessedCardId;''')
          replace(core,
              '''        if (schema != 1 && schema != ADVENTURER_DRAFT_SCHEMA)
            return false;''',
              '''        if (schema != 1 && schema != 2 && schema != ADVENTURER_DRAFT_SCHEMA)
            return false;''')
          replace(core,
              '''        size_t firstDynamic = 8;
        if (schema == ADVENTURER_DRAFT_SCHEMA)
        {
            if (tokens.size() < 11)
                return false;
            state.rerollCharges = static_cast<uint16>(std::stoul(tokens[8]));
            state.destroyCharges = static_cast<uint16>(std::stoul(tokens[9]));
            state.blessedCardId = static_cast<uint32>(std::stoul(tokens[10]));
            firstDynamic = 11;
        }
        else
        {
            state.rerollCharges = GetDraftConfig().rerollStartingCharges;
            state.destroyCharges = GetDraftConfig().destroyStartingCharges;
        }''',
              '''        size_t firstDynamic = 8;
        if (schema == ADVENTURER_DRAFT_SCHEMA)
        {
            if (tokens.size() < 12)
                return false;
            state.rerollCharges = static_cast<uint16>(std::stoul(tokens[8]));
            state.blessCharges = static_cast<uint16>(std::stoul(tokens[9]));
            state.destroyCharges = static_cast<uint16>(std::stoul(tokens[10]));
            state.blessedCardId = static_cast<uint32>(std::stoul(tokens[11]));
            firstDynamic = 12;
        }
        else if (schema == 2)
        {
            if (tokens.size() < 11)
                return false;
            state.rerollCharges = static_cast<uint16>(std::stoul(tokens[8]));
            state.blessCharges = GetDraftConfig().blessStartingCharges;
            state.destroyCharges = static_cast<uint16>(std::stoul(tokens[9]));
            state.blessedCardId = static_cast<uint32>(std::stoul(tokens[10]));
            firstDynamic = 11;
        }
        else
        {
            state.rerollCharges = GetDraftConfig().rerollStartingCharges;
            state.blessCharges = GetDraftConfig().blessStartingCharges;
            state.destroyCharges = GetDraftConfig().destroyStartingCharges;
        }''')
          replace(core,
              '''    if (config.rerollGainEveryLevels > 0 && level > 1 && (level % config.rerollGainEveryLevels) == 0)
        AddCharge(state.rerollCharges, config.rerollGainAmount, config.rerollMaxCharges);
    if (config.destroyGainEveryLevels > 0 && level > 1 && (level % config.destroyGainEveryLevels) == 0)''',
              '''    if (config.rerollGainEveryLevels > 0 && level > 1 && (level % config.rerollGainEveryLevels) == 0)
        AddCharge(state.rerollCharges, config.rerollGainAmount, config.rerollMaxCharges);
    if (config.blessGainEveryLevels > 0 && level > 1 && (level % config.blessGainEveryLevels) == 0)
        AddCharge(state.blessCharges, config.blessGainAmount, config.blessMaxCharges);
    if (config.destroyGainEveryLevels > 0 && level > 1 && (level % config.destroyGainEveryLevels) == 0)''')
          replace(core,
              '''    state.pendingActive = config.initialActivePicks;
    state.rerollCharges = config.rerollStartingCharges;
    state.destroyCharges = config.destroyStartingCharges;''',
              '''    state.pendingActive = config.initialActivePicks;
    state.rerollCharges = config.rerollStartingCharges;
    state.blessCharges = config.blessStartingCharges;
    state.destroyCharges = config.destroyStartingCharges;''')
          replace(core,
              '''void SendDraftMeta(Player* player, DraftState const& state)
{
    std::ostringstream payload;
    payload << "M|" << state.rerollCharges
            << '|' << state.destroyCharges
            << '|' << state.blessedCardId
            << '|' << (GetDraftConfig().blessMaxActive > 0 ? GetDraftConfig().blessWeightMultiplierPercent : 0);
    SendAddonPayload(player, ADVENTURER_DRAFT_PREFIX, payload.str());
}''',
              '''void SendDraftMeta(Player* player, DraftState const& state)
{
    DraftRuntimeConfig const& config = GetDraftConfig();
    std::ostringstream payload;
    payload << "M|" << state.rerollCharges
            << '|' << state.destroyCharges
            << '|' << state.blessedCardId
            << '|' << (config.blessMaxActive > 0 ? config.blessWeightMultiplierPercent : 0)
            << '|' << state.blessCharges
            << '|' << config.rerollStartingCharges
            << '|' << config.blessStartingCharges
            << '|' << config.destroyStartingCharges
            << '|' << uint32(config.initialActiveSourceLevelCap)
            << '|' << GetDraftCards().size();
    SendAddonPayload(player, ADVENTURER_DRAFT_PREFIX, payload.str());
}''')
          replace(core,
              '''    DraftCard const* card = FindDraftCard(cardId);
    if (!card || !IsCardInCurrentOffer(state, cardId) || !IsCardEligible(player, state, *card, state.offerType))
    {
        SendDraftError(player, "INVALID_BLESS", &state);
        return;
    }

    state.blessedCardId = cardId;''',
              '''    if (state.blessCharges == 0)
    {
        SendDraftError(player, "NO_BLESSES", &state);
        return;
    }

    DraftCard const* card = FindDraftCard(cardId);
    if (!card || !IsCardInCurrentOffer(state, cardId) || !IsCardEligible(player, state, *card, state.offerType))
    {
        SendDraftError(player, "INVALID_BLESS", &state);
        return;
    }

    --state.blessCharges;
    state.blessedCardId = cardId;''')

          replace(config,
              '''[Reroll]
# Prototype defaults only; these are balance knobs, not closed design values.
StartingCharges = 2''',
              '''[Reroll]
# Prototype defaults only; these are balance knobs, not closed design values.
StartingCharges = 10''')

          replace(client, 'blessings = "Bendiciones: %s"', 'blessings = "Bendiciones: %d"')
          replace(client, 'blessings = "Blessings: %s"', 'blessings = "Blessings: %d"')
          replace(client,
              '''    rerolls = 0,
    destroys = 0,''',
              '''    rerolls = 0,
    blesses = 0,
    destroys = 0,''')
          replace(client,
              '''    pendingPickedCardId = nil,
}''',
              '''    pendingPickedCardId = nil,
    serverConfigKnown = false,
    serverRerollStart = 0,
    serverBlessStart = 0,
    serverDestroyStart = 0,
    serverSourceCap = 0,
    serverCatalogSize = 0,
}''')
          replace(client,
              '''debugFrame.title:SetText(text.debugTitle)

debugFrame.hint = debugFrame:CreateFontString''',
              '''debugFrame.title:SetText(text.debugTitle)

debugFrame.runtime = debugFrame:CreateFontString(nil, "OVERLAY", "GameFontDisableSmall")
debugFrame.runtime:SetPoint("TOP", debugFrame, "TOP", 0, -43)
debugFrame.runtime:SetText("")

debugFrame.hint = debugFrame:CreateFontString''')
          replace(client,
              '''local function RefreshDebugPool()
    activeColumn.items = BuildDebugList("active")''',
              '''local function RefreshDebugPool()
    if state.serverConfigKnown then
        debugFrame.runtime:SetText(string.format("Server config: R%d B%d D%d  cap %d  catalog %d", state.serverRerollStart, state.serverBlessStart, state.serverDestroyStart, state.serverSourceCap, state.serverCatalogSize))
    else
        debugFrame.runtime:SetText("Server config: old SpellDraft runtime / no report")
    end
    activeColumn.items = BuildDebugList("active")''')
          replace(client,
              '''    local blessMultiplier = (state.blessMultiplierPercent or 0) / 100
    local blessingCount = state.blessMultiplierPercent > 0 and "∞" or "0"
    local status = string.format(text.rerolls, state.rerolls)
        .. "   •   "
        .. string.format(text.blessings, blessingCount)''',
              '''    local blessMultiplier = (state.blessMultiplierPercent or 0) / 100
    local status = string.format(text.rerolls, state.rerolls)
        .. "   •   "
        .. string.format(text.blessings, state.blesses)''')
          replace(client,
              '''    if state.blessMultiplierPercent > 0 and DraftFrame:IsShown() then blessButton:Enable() else blessButton:Disable() end''',
              '''    if state.blesses > 0 and state.blessMultiplierPercent > 0 and DraftFrame:IsShown() then blessButton:Enable() else blessButton:Disable() end''')
          replace(client,
              '''blessButton:SetScript("OnClick", function()
    if state.mode == "bless" then''',
              '''blessButton:SetScript("OnClick", function()
    if state.blesses <= 0 then return end
    if state.mode == "bless" then''')
          replace(client,
              '''    state.rerolls = tonumber(fields[2]) or 0
    state.destroys = tonumber(fields[3]) or 0
    state.blessedCardId = tonumber(fields[4]) or 0
    state.blessMultiplierPercent = tonumber(fields[5]) or 0
    RefreshMetaUI()''',
              '''    state.rerolls = tonumber(fields[2]) or 0
    state.destroys = tonumber(fields[3]) or 0
    state.blessedCardId = tonumber(fields[4]) or 0
    state.blessMultiplierPercent = tonumber(fields[5]) or 0
    state.blesses = tonumber(fields[6]) or 0
    state.serverConfigKnown = #fields >= 11
    state.serverRerollStart = tonumber(fields[7]) or 0
    state.serverBlessStart = tonumber(fields[8]) or 0
    state.serverDestroyStart = tonumber(fields[9]) or 0
    state.serverSourceCap = tonumber(fields[10]) or 0
    state.serverCatalogSize = tonumber(fields[11]) or 0
    RefreshMetaUI()''')

          replace(tests,
              '''    def test_meta_ui_reports_unlimited_blessing_and_has_debug_pool_viewer(self) -> None:
        self.assertIn('blessings = "Bendiciones: %s"', self.meta_client)
        self.assertIn('local blessingCount = state.blessMultiplierPercent > 0 and "∞" or "0"', self.meta_client)''',
              '''    def test_meta_ui_reports_finite_blessing_and_has_debug_pool_viewer(self) -> None:
        self.assertIn('blessings = "Bendiciones: %d"', self.meta_client)
        self.assertIn('state.blesses > 0', self.meta_client)
        self.assertNotIn('"∞"', self.meta_client)''')

          print('SpellDraft runtime patch applied successfully')
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add payload/core/src/server/scripts/Custom/adventurer_core.cpp client/AdventurerDraftMeta.lua config/spelldraft/spelldraft.conf tests/test_spelldraft_v1.py tests/test_bless_charges.py
          git commit -m "fix(spelldraft): honor runtime config and finite bless charges"
          git push origin HEAD:feature/spelldraft-meta-v2
