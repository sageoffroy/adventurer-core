name: apply talent rank alias normalization

on:
  push:
    branches:
      - feature/spelldraft-meta-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spelldraft-meta-v2
          fetch-depth: 0

      - name: Apply migration
        run: python3 tools/_apply_talent_rank_alias_fix.py

      - name: Run full test suite
        run: |
          python3 -m py_compile tools/*.py
          python3 -m unittest discover -s tests -v
          bash -n apply.sh preflight.sh verify.sh rollback.sh update.sh

      - name: Remove temporary migration helpers
        run: |
          rm -f tools/_apply_talent_rank_alias_fix.py
          rm -f .github/workflows/_apply-talent-rank-alias-fix.yml

      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(spelldraft): normalize talent rank aliases from design data"
          git push origin HEAD:feature/spelldraft-meta-v2
