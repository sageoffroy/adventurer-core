name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python tools
        run: python -m py_compile tools/*.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check shell entry points
        run: bash -n apply.sh preflight.sh verify.sh rollback.sh update.sh
      - name: Require executable shell entry points
        run: test -x apply.sh && test -x preflight.sh && test -x verify.sh && test -x rollback.sh && test -x update.sh
      - name: Checkout supported Playerbots core baseline
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: 9fb906bb7296212ff42fc95ff73a92aaf8554f0d
          path: _supported-core
          fetch-depth: 1
      - name: Smoke-test clean core source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path.cwd()
          sys.path.insert(0, str(root / "tools"))
          from core_patch import plan

          core = (root / "_supported-core").resolve()
          payload = (root / "payload" / "core").resolve()
          planned = plan(core, payload)
          runtime_rel = "src/server/scripts/Custom/adventurer_core.cpp"
          runtime = next(item for item in planned if item.relative_path == runtime_rel)
          dbc_structure = next(item for item in planned if item.relative_path.endswith("DBCStructure.h"))
          dbc_stores = next(item for item in planned if item.relative_path.endswith("DBCStores.cpp"))

          assert len(planned) == 9
          assert b"#define MAX_TALENT_TABS 4" in dbc_structure.patched
          assert b"sTalentTabPages[MAX_CLASSES][MAX_TALENT_TABS]" in dbc_stores.patched
          assert runtime.original is None
          assert runtime.patched == (payload / runtime_rel).read_bytes()
          text = runtime.patched.decode("utf-8")
          assert "ADVENTURER_MAX_RAGE = 1000" in text
          assert "ADVENTURER_MAX_ENERGY = 100" in text
          assert 'ADVENTURER_COMBO_PREFIX[] = "AdventurerCP"' in text
          for token in (
              "CLASS_DEATH_KNIGHT",
              "POWER_RUNIC_POWER",
              "POWER_RUNE",
              "MAX_RUNES",
              "GetRuneCooldown",
              "ResyncRunes",
              "AddRunePower",
              "PLAYERHOOK_ON_PLAYER_IS_CLASS",
          ):
              assert token not in text, token
          print("Supported clean-core four-tree source patch smoke test OK")
          PY
