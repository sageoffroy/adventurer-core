name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python tools
        run: python -m py_compile tools/*.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check shell entry points
        run: bash -n apply.sh preflight.sh verify.sh rollback.sh update.sh
      - name: Require executable shell entry points
        run: test -x apply.sh && test -x preflight.sh && test -x verify.sh && test -x rollback.sh && test -x update.sh
      - name: Checkout supported Dungeon Master module
        uses: actions/checkout@v4
        with:
          repository: InstanceForge/mod-dungeon-master
          ref: 8a561da4391e974f93eeb135b61a63d7ac44ccaf
          path: _dm-core/modules/mod-dungeon-master
          fetch-depth: 1
      - name: Smoke-test Dungeon Master Adventurer compatibility
        run: |
          mkdir -p _dm-core/env/dist/etc/modules
          cp _dm-core/modules/mod-dungeon-master/conf/mod_dungeon_master.conf.dist \
             _dm-core/env/dist/etc/modules/mod_dungeon_master.conf

          python tools/dungeon_master_source_patch.py install --core-dir _dm-core
          python tools/dungeon_master_source_patch.py verify --core-dir _dm-core
          python tools/dungeon_master_source_fixup.py install --core-dir _dm-core
          python tools/dungeon_master_source_fixup.py verify --core-dir _dm-core
          python tools/dungeon_master_experience_patch.py install --core-dir _dm-core
          python tools/dungeon_master_experience_patch.py verify --core-dir _dm-core
          python tools/dungeon_master_dungeon_names_patch.py install --core-dir _dm-core
          python tools/dungeon_master_dungeon_names_patch.py verify --core-dir _dm-core
          python tools/dungeon_master_source_patch.py verify --core-dir _dm-core
          python tools/dungeon_master_runtime.py install --core-dir _dm-core
          python tools/dungeon_master_runtime.py verify --core-dir _dm-core

          grep -F 'DungeonMaster.Difficulty.1 = "Novato,1,19,0.6,0.6,1.0,0.5"' \
             _dm-core/env/dist/etc/modules/mod_dungeon_master.conf
          grep -F 'DungeonMaster.Cooldown.Minutes = 0' \
             _dm-core/env/dist/etc/modules/mod_dungeon_master.conf
          grep -F 'Aventureros normal mode: keep the original dungeon.' \
             _dm-core/modules/mod-dungeon-master/src/DungeonMasterMgr.cpp
          grep -F 'TELE_TO_GM_MODE' \
             _dm-core/modules/mod-dungeon-master/src/DungeonMasterMgr.cpp
          grep -F 'Comenzar desafío' \
             _dm-core/modules/mod-dungeon-master/src/scripts/npc_dungeon_master.cpp
          grep -F 'Habitantes originales' \
             _dm-core/modules/mod-dungeon-master/src/scripts/npc_dungeon_master.cpp
          grep -F 'Minas de la Muerte' \
             _dm-core/modules/mod-dungeon-master/src/DMConfig.cpp
          grep -F 'Aventureros source fixup v2' \
             _dm-core/modules/mod-dungeon-master/src/DungeonMasterMgr.cpp
          grep -F 'Aventureros source fixup v3' \
             _dm-core/modules/mod-dungeon-master/src/scripts/dm_unit_script.cpp

          python tools/dungeon_master_runtime.py rollback --core-dir _dm-core
          python tools/dungeon_master_dungeon_names_patch.py rollback --core-dir _dm-core
          python tools/dungeon_master_experience_patch.py rollback --core-dir _dm-core
          python tools/dungeon_master_source_patch.py rollback --core-dir _dm-core
          git -C _dm-core/modules/mod-dungeon-master diff --exit-code
      - name: Checkout supported Playerbots core baseline
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: 9fb906bb7296212ff42fc95ff73a92aaf8554f0d
          path: _supported-core
          fetch-depth: 1
      - name: Smoke-test clean core source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path.cwd()
          sys.path.insert(0, str(root / "tools"))
          from core_patch import plan

          core = (root / "_supported-core").resolve()
          payload = (root / "payload" / "core").resolve()
          planned = plan(core, payload)
          runtime_rel = "src/server/scripts/Custom/adventurer_core.cpp"
          runtime = next(item for item in planned if item.relative_path == runtime_rel)

          assert len(planned) == 7
          assert runtime.original is None
          assert runtime.patched == (payload / runtime_rel).read_bytes()
          text = runtime.patched.decode("utf-8")
          assert "ADVENTURER_MAX_RAGE = 1000" in text
          assert "ADVENTURER_MAX_ENERGY = 100" in text
          assert 'ADVENTURER_COMBO_PREFIX[] = "AdventurerCP"' in text
          assert 'ADVENTURER_DRAFT_PREFIX[] = "AdventurerDraft"' in text
          assert "SelectWeightedCards" in text
          assert "GetNextSpellInChain" in text
          assert "character_settings" in text
          for token in (
              "CLASS_DEATH_KNIGHT",
              "POWER_RUNIC_POWER",
              "POWER_RUNE",
              "MAX_RUNES",
              "GetRuneCooldown",
              "ResyncRunes",
              "AddRunePower",
              "PLAYERHOOK_ON_PLAYER_IS_CLASS",
          ):
              assert token not in text, token

          player_h = (core / "src/server/game/Entities/Player/Player.h").read_text(encoding="utf-8")
          spell_mgr_h = (core / "src/server/game/Spells/SpellMgr.h").read_text(encoding="utf-8")
          player_script_h = (core / "src/server/game/Scripting/ScriptDefines/PlayerScript.h").read_text(encoding="utf-8")
          settings_h = (core / "src/server/game/Entities/Player/PlayerSettings.h").read_text(encoding="utf-8")

          assert "void SetAcceptWhispers(bool on)" in player_h
          assert "void SetFreeTalentPoints(uint32 points);" in player_h
          assert "void removeSpell(uint32 spellId, uint8 removeSpecMask, bool onlyTemporary);" in player_h
          assert "uint32 GetFirstSpellInChain(uint32 spell_id) const;" in spell_mgr_h
          assert "uint32 GetNextSpellInChain(uint32 spell_id) const;" in spell_mgr_h
          assert "PLAYERHOOK_CAN_PLAYER_USE_PRIVATE_CHAT" in player_script_h
          assert "std::string& /*msg*/, Player* /*receiver*/" in player_script_h
          assert 'existing "source" row from character_settings' in settings_h

          print("Supported clean-core no-DK + SpellDraft API smoke test OK")
          PY
