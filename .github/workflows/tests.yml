name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python tools
        run: python -m py_compile tools/*.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check shell entry points
        run: bash -n apply.sh preflight.sh verify.sh rollback.sh
